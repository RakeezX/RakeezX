<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>رَكيز المعلم</title>
  <meta name="description" content="رَكيز المعلم: سجل المعلّم — الفصول والحصص والحضور والدرجات والتقارير. يعمل دون إنترنت.">
  <link rel="canonical" href="https://rakeezx.com/">
  <meta property="og:url" content="https://rakeezx.com/">
  <meta name="theme-color" content="#18A878">
  <script>
    (() => {
      const key = 'rakeezx-theme';
      let theme = 'light';
      try {
        const saved = localStorage.getItem(key);
        if (saved === 'light' || saved === 'dark' || saved === 'auto') theme = saved;
      } catch {}
      if (theme === 'auto') document.documentElement.removeAttribute('data-theme');
      else document.documentElement.setAttribute('data-theme', theme);
      const dark = theme === 'dark' || (theme === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.querySelector('meta[name="theme-color"]')?.setAttribute('content', dark ? '#0f1216' : '#0f766e');
    })();
  </script>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/favicon-32.png?v=19" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="assets/icon-180.png" sizes="180x180">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="رَكيز المعلم">
  <link rel="stylesheet" href="src/styles/app.css">
  <link rel="stylesheet" href="src/styles/components.css">
  <link rel="stylesheet" href="src/styles/schedule-work-integration.css">
  <link rel="stylesheet" href="src/styles/calendar-work-0417.css">
  <link rel="stylesheet" href="src/styles/rakeez-datetime.css">
  <link rel="stylesheet" href="src/styles/work-n82.css">
  <link rel="stylesheet" href="src/styles/work-n73.css">
</head>
<body>
  <div id="app" class="app-shell">
    <div class="boot" role="status" aria-live="polite" aria-label="جارٍ تجهيز مساحة عملك">
      <div class="boot__composition">
        <div class="boot__mark"><span class="brand-lockup" role="img" aria-label="رَكيز المعلم"><img class="brand-lockup__image brand-lockup__image--light" src="assets/header-light-standard.svg" width="345" height="56" alt="" aria-hidden="true"><img class="brand-lockup__image brand-lockup__image--dark" src="assets/header-dark-standard.svg" width="345" height="56" alt="" aria-hidden="true"></span></div>
        <div class="boot__msg">جارٍ تجهيز مساحة عملك…</div>
        <div class="boot__progress" aria-hidden="true"></div>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true"></div>
  <div id="modal-root"></div>

  <script type="module" src="src/app.js"></script>
</body>
</html>
